# CI + Deploy workflow for Project TIM
# ---------------------------------------------------
# This workflow runs on every push/PR to the `main` branch.
# It:
#   1️⃣ Installs Python and runs the pytest suite.
#   2️⃣ Builds the Docker image and pushes it to Docker Hub.
#   3️⃣ Deploys the freshly‑pushed image to Fly.io (free tier).
# ---------------------------------------------------

name: CI + Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      # ---------- Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Python tests ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install & run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

      # ---------- Docker build & push ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tim-inspector:latest

      # ---------- Fly.io deployment ----------
      - name: Install Fly CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          export PATH=$HOME/.fly/bin:$PATH

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          export PATH=$HOME/.fly/bin:$PATH
          # Create the app if it does not exist (idempotent)
          flyctl apps list | grep tim-inspector || flyctl apps create tim-inspector
          # Deploy the newly‑pushed image
          flyctl deploy \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/tim-inspector:latest \
            --app tim-inspector \
            --remote-only \
            --ha=false
